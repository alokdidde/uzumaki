name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Offline check (ruff, format, mypy, pytest, build)
        run: make check
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"
      - name: Install pinned dependencies with the simulator stack
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-sim.txt
          python -m pip install --no-deps -e .
      - name: Fetch and verify the pinned SO-101, Panda, ALOHA, TidyBot, Spot, G1, Go1, UMI gripper and Go1 walking-policy assets
        run: make sim-assets
      - name: Typecheck with the simulator stack installed
        run: python -m mypy src
      - name: MuJoCo SO-101, Panda, ALOHA, TidyBot, Spot, G1, Go1 and walking Go1 suites (fail if the simulator is unavailable)
        run: make sim
